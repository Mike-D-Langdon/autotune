[project]
name = "autotune"
version = "0.1.0"
description = "Autotune audio processor with web GUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "psola>=0.0.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "flask>=3.0.0",
    "nicegui>=1.4.0",
]

[project.scripts]
autotune = "main:main"
